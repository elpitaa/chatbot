<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Informatika AI Assistant - Universitas Trunojoyo Madura</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#133E87",
            "primary-container": "#002864",
            "secondary": "#006398",
            "surface": "#FAF8FF",
            "surface-container": "#EAEDFF",
            "surface-container-low": "#F2F3FF",
            "surface-container-lowest": "#FFFFFF",
            "surface-container-high": "#E2E7FF",
            "on-surface": "#131B2E",
            "on-surface-variant": "#434651",
            "outline-variant": "#E2E8F0"
          },
          fontFamily: {
            sans: ["'Plus Jakarta Sans'", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col h-screen overflow-hidden">
<!-- Header -->
<header class="h-16 border-b border-slate-200/80 bg-white/90 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between z-30 shrink-0">
<div class="flex items-center gap-3">
<div class="flex items-center gap-3">
<div class="h-10 flex items-center gap-2">
    <img src="/static/UTM.png" alt="Logo UTM" class="h-9 w-auto object-contain">
    <img src="/static/logo-fakultas.png" alt="Logo Fakultas" class="h-9 w-auto object-contain">
    <img src="/static/logo-prodi.png" alt="Logo Program Studi" class="h-9 w-auto object-contain">
</div>
<div class="hidden sm:flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs font-medium border border-slate-200/60">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
<span class="">Chatbot Layanan Akademik IF UTM</span>
</div>
</div>
</div>
<div class="flex items-center gap-2">
<a class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-600 hover:text-primary hover:bg-slate-100 rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined text-base">arrow_back</span>
<a href="https://informatika.trunojoyo.ac.id/" target="_blank" rel="noopener noreferrer">
    <span class="hidden sm:inline">Kembali ke Portal Prodi</span>
</a>
</a>
</div>
</header>
<!-- Main Chat Area -->
<div class="flex-1 flex overflow-hidden relative">
<!-- Main Chat Content -->
<main class="flex-1 flex flex-col bg-white overflow-hidden relative">
<!-- Scrollable Message Area -->
<div class="flex-1 overflow-y-auto px-4 py-6 sm:px-6" id="chatScrollArea">
<div class="max-w-3xl mx-auto flex flex-col gap-6">
<!-- Empty Initial State -->
<div class="min-h-[52vh] flex flex-col items-center justify-center text-center px-4">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
<span class="material-symbols-outlined text-2xl">neurology</span>
</div>
<div>
<h1 class="text-base sm:text-lg font-bold text-slate-900">Asisten Akademik Informatika</h1>
<p class="text-sm text-slate-600 mt-1 leading-relaxed">
                  Silakan tulis pertanyaan seputar akademik Teknik Informatika UTM.
                </p>
</div>
</div>
</div>
<!-- Messages Stream -->
<div class="flex flex-col gap-5" id="chatMessagesStream">
</div>
</div>
</div>
<!-- Minimal Bottom Prompt Bar -->
<div class="p-4 border-t border-slate-200/80 bg-white/95 backdrop-blur-md shrink-0">
<div class="max-w-3xl mx-auto flex flex-col gap-2">
<div class="relative flex items-center bg-slate-100 focus-within:bg-white border border-slate-300/80 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/15 rounded-xl shadow-xs transition-all px-3 py-1.5">
<button class="p-1.5 text-slate-400 hover:text-primary rounded-lg transition-colors" title="Unggah Draft KRS / Naskah PDF" type="button">
<span class="material-symbols-outlined text-xl">attach_file</span>
</button>
<input class="w-full bg-transparent border-none px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-0" id="chatInputArea" placeholder="Tanyakan seputar kurikulum, skripsi, dosen, atau layanan prodi..." type="text">
<button class="p-2 bg-primary hover:bg-primary-container text-white rounded-lg flex items-center justify-center transition-colors shrink-0 shadow-xs" onclick="sendMessage()" title="Kirim" type="button">
<span class="material-symbols-outlined text-lg">send</span>
</button>
</div>
<div class="text-center">
<span class="text-[11px] text-slate-400">
              AI Asisten Akademik TI UTM • Verifikasi putusan resmi tetap merujuk pada Pedoman Fakultas &amp; Dosen Wali.
            </span>
</div>
</div>
</div>
</main>
</div>
<script>
    function startNewChat() {
      const stream = document.getElementById('chatMessagesStream');
      if (stream) {
        stream.innerHTML = '';
      }
      const input = document.getElementById('chatInputArea');
      if (input) {
        input.value = '';
        input.focus();
      }
    }

    function copyResponse(btn) {
      const parent = btn.closest('.bg-slate-50');
      if (!parent) return;
      const text = parent.innerText;
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined text-sm text-emerald-600">check</span><span class="text-emerald-600">Tersalin</span>';
        setTimeout(() => {
          btn.innerHTML = original;
        }, 1500);
      });
    }

    async function sendMessage() {
      const input = document.getElementById('chatInputArea');
      const stream = document.getElementById('chatMessagesStream');
      const scrollArea = document.getElementById('chatScrollArea');
      if (!input || !stream || !input.value.trim()) return;

      const userText = input.value.trim();
      input.value = '';

      const userBubble = document.createElement('div');
      userBubble.className = 'flex items-start justify-end gap-3 pl-8';
      userBubble.innerHTML = `
        <div class="flex flex-col items-end gap-1 max-w-xl">
          <div class="bg-primary text-white rounded-2xl rounded-tr-xs px-4 py-3 shadow-xs text-sm leading-relaxed">
            ${escapeHtml(userText)}
          </div>
          <span class="text-[11px] text-slate-400 pr-1">Baru saja</span>
        </div>
      `;
      stream.appendChild(userBubble);
      scrollArea.scrollTop = scrollArea.scrollHeight;

      // Temporary typing indicator
      const typingIndicator = document.createElement('div');
      typingIndicator.id = 'typingIndicator';
      typingIndicator.className = 'flex items-start gap-3 pr-4';
      typingIndicator.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center shrink-0 mt-1">
          <span class="material-symbols-outlined text-base">auto_awesome</span>
        </div>
        <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-2xl rounded-tl-xs text-xs text-slate-500 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-primary animate-bounce"></span>
          <span class="w-2 h-2 rounded-full bg-primary animate-bounce [animation-delay:0.2s]"></span>
          <span class="w-2 h-2 rounded-full bg-primary animate-bounce [animation-delay:0.4s]"></span>
          <span class="ml-1 font-medium">Mencari data kurikulum...</span>
        </div>
      `;
      stream.appendChild(typingIndicator);
      scrollArea.scrollTop = scrollArea.scrollHeight;

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userText })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Server gagal memproses pertanyaan.');
        typingIndicator.remove();

        const botResponse = document.createElement('div');
        botResponse.className = 'flex items-start gap-3 pr-4';
        botResponse.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center shrink-0 mt-1">
            <span class="material-symbols-outlined text-base font-bold">auto_awesome</span>
          </div>
          <div class="flex flex-col items-start gap-2 max-w-2xl w-full">
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl rounded-tl-xs p-5 shadow-xs w-full">
              <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200/70">
                <span class="text-xs font-bold text-primary flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                  Informatika AI Assistant
                </span>
                <span class="text-[11px] text-slate-400">Baru saja</span>
              </div>
              <p class="text-sm text-slate-700 leading-relaxed mb-3">${escapeHtml(data.response).replace(/\n/g, '<br>')}</p>
              <div class="pt-3 border-t border-slate-200/70 flex items-center justify-between text-xs text-slate-500">
                <span class="flex items-center gap-1">
                  <span class="material-symbols-outlined text-sm text-primary">verified</span>
                  Pedoman Akademik Informatika UTM 2024/2025
                </span>
                <button onclick="copyResponse(this)" class="hover:text-primary flex items-center gap-1 font-medium transition-colors">
                  <span class="material-symbols-outlined text-sm">content_copy</span>
                  <span>Salin</span>
                </button>
              </div>
            </div>
          </div>
        `;
        stream.appendChild(botResponse);
      } catch (error) {
        typingIndicator.remove();
        const errorMessage = document.createElement('div');
        errorMessage.className = 'flex items-start gap-3 pr-4';
        errorMessage.innerHTML = `<div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0 mt-1"><span class="material-symbols-outlined text-base">error</span></div><div class="bg-red-50 border border-red-200 rounded-2xl rounded-tl-xs p-4 text-sm text-red-700">${escapeHtml(error.message)}</div>`;
        stream.appendChild(errorMessage);
      }
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    document.getElementById('chatInputArea')?.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>


</body></html>
